<!doctype html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: transparent;
		}

		/* Существующая структура теперь вкладывается в #content-container */
		#background-root {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
		}

		#desktop-root {
			position: absolute;
			top: 68px !important;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: calc(100% - 68px);
			z-index: 1;
		}
	</style>
</head>

<body>
	<div id="background-root"></div>
	<div id="desktop-root"></div>

	<script type="module" src="./Index.jsx"></script>
</body>

</html>
